<main class="detail-page">
  <header class="detail-header">
    <app-button class="back-link" label="Volver al portafolio" icon="pi pi-arrow-left" routerLink="/" />
  </header>
  <section class="detail-hero">
    <div class="detail-title-row">
      <div><h1>{{ project.title }}</h1><p>{{ project.description }}</p></div>
      <div class="detail-tags">@for (tag of project.tags; track tag) { <app-project-tag [label]="tag" /> }</div>
    </div>
  </section>
  <section class="detail-body">
    <div class="detail-gallery">
      @for (image of project.images; track image) {
        <img [src]="'/assets/' + image" [alt]="project.title + ' — imagen del proyecto'" />
      }
    </div>
    <div class="detail-copy">
      <p>
        Aquí podremos desarrollar el caso completo: contexto, decisiones de diseño, exploraciones y
        resultado final.
      </p>
      <app-button label="Hablemos de tu proyecto" icon="pi pi-arrow-up-right" routerLink="/contacto" />
    </div>
  </section>
  <app-footer />
</main>
